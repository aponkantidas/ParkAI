<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Touchless Parking Management</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }
        .camera-grid { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .cam-box { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        .cam-box h3 { margin-top: 0; text-align: center; color: #cbd5e1; }
        .cam-box img { width: 440px; height: 320px; object-fit: cover; border-radius: 6px; }
        table { width: 920px; margin: 0 auto; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0284c7; color: white; }
        .status-active { color: #38bdf8; font-weight: bold; }
        .status-completed { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Automated Parking Management System</h1>

    <div class="camera-grid">
        <div class="cam-box">
            <h3>Gate 1: Entry Camera</h3>
            <img src="{{ url_for('video_entry') }}" alt="Entry Feed">
        </div>
        <div class="cam-box">
            <h3>Gate 2: Exit Camera</h3>
            <img src="{{ url_for('video_exit') }}" alt="Exit Feed">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Plate Number</th>
                <th>Entry Time</th>
                <th>Exit Time</th>
                <th>Duration (min)</th>
                <th>Total (BDT)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        async function fetchLogs() {
            const res = await fetch('/api/records');
            const data = await res.json();
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row[0]}</td>
                    <td><b>${row[1]}</b></td>
                    <td>${row[2] || '-'}</td>
                    <td>${row[3] || '-'}</td>
                    <td>${row[4] ? row[4] : '-'}</td>
                    <td>${row[5] ? row[5] + ' /=' : '-'}</td>
                    <td class="${row[6] === 'ACTIVE' ? 'status-active' : 'status-completed'}">${row[6]}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        setInterval(fetchLogs, 2000);
        fetchLogs();
    </script>
</body>
</html>
