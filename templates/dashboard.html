<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Parking Dashboard</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 25px;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .floors-wrapper {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 1020px;
            margin: 0 auto 25px auto;
        }
        .floor-group {
            background: #131c31;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px 20px;
            text-align: center;
        }
        .floor-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .slots-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .slot-card {
            background: #1e293b;
            border: 2px solid #22c55e;
            border-radius: 10px;
            padding: 12px 18px;
            text-align: center;
            min-width: 115px;
        }
        .slot-card.occupied {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }
        .slot-title { font-size: 13px; color: #94a3b8; font-weight: bold; }
        .slot-state { font-size: 16px; font-weight: bold; margin-top: 4px; color: #4ade80; }
        .slot-card.occupied .slot-state { color: #f87171; }
        .cams-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }
        .cam-box {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            width: 480px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .cam-box h3 { margin-top: 0; color: #e2e8f0; }
        .cam-box img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            background: #0f172a;
        }
        .table-container {
            max-width: 1020px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: #38bdf8; font-size: 14px; text-transform: uppercase; }
        tr:hover { background-color: #263349; }
        .badge-active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
        }
        .badge-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-delete {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

    <h1>Automated Parking Management System</h1>

    <div class="floors-wrapper">
        <div class="floor-group">
            <div class="floor-label">Ground Floor</div>
            <div class="slots-bar">
                <div class="slot-card" id="slot-0"><div class="slot-title">SLOT 1</div><div class="slot-state">EMPTY</div></div>
                <div class="slot-card" id="slot-1"><div class="slot-title">SLOT 2</div><div class="slot-state">EMPTY</div></div>
                <div class="slot-card" id="slot-2"><div class="slot-title">SLOT 3</div><div class="slot-state">EMPTY</div></div>
                <div class="slot-card" id="slot-3"><div class="slot-title">SLOT 4</div><div class="slot-state">EMPTY</div></div>
            </div>
        </div>

        <div class="floor-group">
            <div class="floor-label" style="color: #38bdf8;">Second Floor</div>
            <div class="slots-bar">
                <div class="slot-card" id="slot-4"><div class="slot-title">SLOT 5</div><div class="slot-state">EMPTY</div></div>
                <div class="slot-card" id="slot-5"><div class="slot-title">SLOT 6</div><div class="slot-state">EMPTY</div></div>
            </div>
        </div>
    </div>

    <div class="cams-container">
        <div class="cam-box">
            <h3>Gate 1: Entry Camera</h3>
            <img src="/video_entry" alt="Entry Camera Stream">
        </div>
        <div class="cam-box">
            <h3>Gate 2: Exit Camera</h3>
            <img src="/video_exit" alt="Exit Camera Stream">
        </div>
    </div>

    <div class="table-container">
        <h3 style="margin-top: 0; color: #cbd5e1;">Recent Parking Logs</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Plate Number</th>
                    <th>Entry Time</th>
                    <th>Exit Time</th>
                    <th>Duration (Min)</th>
                    <th>Paid (Taka)</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="records-body"></tbody>
        </table>
    </div>

    <script>
        function formatTime(ts) {
            if (!ts) return "-";
            return ts.split("T")[1]?.split(".")[0] || ts;
        }

        async function fetchSlots() {
            try {
                const res = await fetch('/api/slots');
                const data = await res.json();
                if (data.slots) {
                    data.slots.forEach((val, idx) => {
                        const card = document.getElementById(`slot-${idx}`);
                        if (!card) return;
                        const stateEl = card.querySelector('.slot-state');
                        if (val === 1) {
                            card.classList.add('occupied');
                            stateEl.innerText = 'OCCUPIED';
                        } else {
                            card.classList.remove('occupied');
                            stateEl.innerText = 'EMPTY';
                        }
                    });
                }
            } catch (e) { console.error("Error fetching slots:", e); }
        }

        async function fetchRecords() {
            try {
                const res = await fetch('/api/records');
                const rows = await res.json();
                const tbody = document.getElementById('records-body');
                tbody.innerHTML = "";

                rows.forEach(row => {
                    const [id, plate, entry, exit, duration, paid, status] = row;
                    const badgeClass = status === 'ACTIVE' ? 'badge-active' : 'badge-completed';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${id}</td>
                        <td style="font-weight: bold; color: #f8fafc;">${plate}</td>
                        <td>${formatTime(entry)}</td>
                        <td>${formatTime(exit)}</td>
                        <td>${duration !== null ? duration : '-'}</td>
                        <td style="color: #4ade80; font-weight: bold;">${paid} Taka</td>
                        <td><span class="${badgeClass}">${status}</span></td>
                        <td>
                            <button class="btn-delete" onclick="deleteRecord(${id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) { console.error("Error fetching records:", e); }
        }

        async function deleteRecord(id) {
            if (!confirm(`Are you sure you want to delete parking record #${id}?`)) return;
            try {
                const res = await fetch(`/api/delete/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) fetchRecords();
            } catch (e) { console.error("Failed to delete record:", e); }
        }

        fetchSlots();
        fetchRecords();
        setInterval(() => {
            fetchSlots();
            fetchRecords();
        }, 2000);
    </script>
</body>
</html>
