<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gate 2: Exit & Payment</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 35px;
            width: 480px;
            text-align: center;
            border: 2px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status-idle { color: #94a3b8; font-size: 24px; margin-bottom: 20px; }
        .plate-box {
            background: #0f172a;
            border: 2px solid #e2e8f0;
            padding: 10px;
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: bold;
            color: #f8fafc;
            border-radius: 8px;
            margin: 10px 0;
        }
        .bill-box {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .amount { font-size: 36px; font-weight: bold; color: #4ade80; }
        .qr-placeholder {
            margin: 15px auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #cbd5e1; margin-top: 0;">Exit & Payment Kiosk</h2>

        <div id="idle-view">
            <div class="status-idle">Approach Exit Gate</div>
            <p style="color: #64748b;">Scanning license plate...</p>
        </div>

        <div id="bill-view" style="display: none;">
            <div class="plate-box" id="exit-plate">---</div>
            <p style="color: #94a3b8; margin: 5px 0;">Duration: <span id="exit-duration" style="color: #f1f5f9; font-weight: bold;"></span></p>
            
            <div class="bill-box">
                <div style="font-size: 14px; color: #cbd5e1;">TOTAL AMOUNT TO PAY</div>
                <div class="amount" id="exit-bill">0 Taka</div>
            </div>

            <div class="qr-placeholder">
                <!-- Generates a dummy QR code dynamically -->
                <img id="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=ParkingFeePayment" alt="Payment QR Code" width="150" height="150">
            </div>
            <div style="font-size: 13px; color: #94a3b8;">Scan with your mobile wallet to pay</div>
        </div>
    </div>

    <script>
        let lastSeenExitId = 0;
        async function checkExit() {
            try {
                const res = await fetch('/api/latest_exit');
                const data = await res.json();
                if (data && data.id && data.id !== lastSeenExitId) {
                    lastSeenExitId = data.id;
                    document.getElementById('idle-view').style.display = 'none';
                    document.getElementById('bill-view').style.display = 'block';

                    document.getElementById('exit-plate').innerText = data.plate;
                    document.getElementById('exit-duration').innerText = `${data.duration} mins`;
                    document.getElementById('exit-bill').innerText = `${data.bill} Taka`;

                    // Update QR code data with the exact plate & bill
                    const qrData = encodeURIComponent(`Pay ${data.bill} Taka for Plate ${data.plate}`);
                    document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${qrData}`;

                    // Return to scanning screen after 10 seconds
                    setTimeout(() => {
                        document.getElementById('bill-view').style.display = 'none';
                        document.getElementById('idle-view').style.display = 'block';
                    }, 10000);
                }
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(checkExit, 1000);
    </script>
</body>
</html>
