<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gate 2: Exit Gate</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 35px;
            width: 500px;
            text-align: center;
            border: 2px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .plate-box {
            background: #0f172a;
            border: 2px solid #e2e8f0;
            padding: 10px;
            font-size: 26px;
            letter-spacing: 2px;
            font-weight: bold;
            border-radius: 8px;
            margin: 15px 0;
        }
        .open-box {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #4ade80;
            padding: 25px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
        }
        .stop-box {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #f87171;
            padding: 20px;
            border-radius: 12px;
        }
        .qr-placeholder {
            margin: 15px auto;
            background: #ffffff;
            padding: 8px;
            border-radius: 8px;
            width: 140px;
            height: 140px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #cbd5e1; margin-top: 0;">Automated Exit Gate</h2>

        <div id="idle-view">
            <div style="color: #94a3b8; font-size: 24px;">Approach Exit Gate</div>
            <p style="color: #64748b;">Scanning license plate...</p>
        </div>

        <!-- APPROVED VIEW -->
        <div id="approved-view" style="display: none;">
            <div class="plate-box" id="ok-plate">---</div>
            <div class="open-box">
                PAYMENT VERIFIED<br>
                <span style="font-size: 18px; color: #fff;">Gate Opening... Safe Travels!</span>
            </div>
        </div>

        <!-- PAYMENT / OVERSTAY VIEW -->
        <div id="blocked-view" style="display: none;">
            <div class="plate-box" id="stop-plate">---</div>
            <div class="stop-box">
                <div id="stop-title" style="font-size: 20px; font-weight: bold;">PAYMENT REQUIRED</div>
                <p id="stop-reason" style="color: #f1f5f9; font-size: 15px;"></p>
                <div style="font-size: 30px; font-weight: bold; color: #facc15;" id="stop-amount">0 Taka</div>
            </div>

            <div class="qr-placeholder">
                <img id="qr-img" src="" alt="QR" width="140" height="140">
            </div>
            <div style="font-size: 14px; color: #38bdf8;">Scan QR or visit <strong>/pay</strong> on your phone to clear balance</div>
        </div>
    </div>

    <script>
        let lastEventKey = "";
        async function checkExit() {
            try {
                const res = await fetch('/api/latest_exit');
                const data = await res.json();
                if (data && data.event_key && data.event_key !== lastEventKey) {
                    lastEventKey = data.event_key;
                    document.getElementById('idle-view').style.display = 'none';

                    if (data.status === "OPEN") {
                        document.getElementById('blocked-view').style.display = 'none';
                        document.getElementById('approved-view').style.display = 'block';
                        document.getElementById('ok-plate').innerText = data.plate;
                    } else {
                        document.getElementById('approved-view').style.display = 'none';
                        document.getElementById('blocked-view').style.display = 'block';
                        document.getElementById('stop-plate').innerText = data.plate;
                        document.getElementById('stop-title').innerText = data.title;
                        document.getElementById('stop-reason').innerText = data.reason;
                        document.getElementById('stop-amount').innerText = `${data.due} Taka`;

                        const payUrl = `${window.location.origin}/pay`;
                        document.getElementById('qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(payUrl)}`;
                    }

                    setTimeout(() => {
                        document.getElementById('approved-view').style.display = 'none';
                        document.getElementById('blocked-view').style.display = 'none';
                        document.getElementById('idle-view').style.display = 'block';
                    }, 8000);
                }
            } catch (e) { console.error(e); }
        }
        setInterval(checkExit, 1000);
    </script>
</body>
</html>
