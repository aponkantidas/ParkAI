<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gate 1: Entry Gate</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            width: 480px;
            text-align: center;
            border: 2px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .status-idle { color: #94a3b8; font-size: 24px; margin-bottom: 20px; }
        .status-active { color: #22c55e; font-size: 28px; font-weight: bold; margin-bottom: 15px; }
        .plate-box {
            background: #0f172a;
            border: 2px dashed #38bdf8;
            padding: 15px;
            font-size: 32px;
            letter-spacing: 2px;
            font-weight: bold;
            color: #38bdf8;
            border-radius: 10px;
            margin: 20px 0;
        }
        .slot-banner {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid #facc15;
            color: #facc15;
            padding: 14px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
            line-height: 1.4;
        }
        .rate-notice {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #cbd5e1; margin-top: 0;">Automated Parking System</h2>
        
        <div id="idle-view">
            <div class="status-idle">Please Approach Gate</div>
            <p style="color: #64748b;">Scanning license plate...</p>
        </div>

        <div id="detected-view" style="display: none;">
            <div class="status-active" id="entry-status">Car Recognized!</div>
            <div class="plate-box" id="entry-plate">---</div>
            <div class="slot-banner" id="entry-msg">Please park at SLOT --</div>
            <div class="rate-notice">Rate: 20 Taka / Hour</div>
        </div>
    </div>

    <script>
        let lastSeenId = 0;
        async function checkEntry() {
            try {
                const res = await fetch('/api/latest_entry');
                const data = await res.json();
                if (data && data.id && data.id !== lastSeenId) {
                    lastSeenId = data.id;
                    document.getElementById('idle-view').style.display = 'none';
                    document.getElementById('detected-view').style.display = 'block';
                    document.getElementById('entry-plate').innerText = data.plate;

                    const statusEl = document.getElementById('entry-status');
                    const msgEl = document.getElementById('entry-msg');

                    if (data.status === "FULL") {
                        statusEl.innerText = "PARKING FULL!";
                        statusEl.style.color = "#ef4444";
                        msgEl.style.color = "#f87171";
                        msgEl.style.borderColor = "#ef4444";
                        msgEl.style.background = "rgba(239, 68, 68, 0.15)";
                        msgEl.innerText = "No Empty Slots Available";
                    } else {
                        statusEl.innerText = "Car Recognized!";
                        statusEl.style.color = "#22c55e";
                        
                        const isSecondFloor = data.slot >= 5;
                        const floorName = data.floor || (isSecondFloor ? "Second Floor" : "Ground Floor");
                        
                        // Highlight Second Floor in cyan/blue and Ground Floor in yellow
                        if (isSecondFloor) {
                            msgEl.style.color = "#38bdf8";
                            msgEl.style.borderColor = "#38bdf8";
                            msgEl.style.background = "rgba(56, 189, 248, 0.15)";
                        } else {
                            msgEl.style.color = "#facc15";
                            msgEl.style.borderColor = "#facc15";
                            msgEl.style.background = "rgba(250, 204, 21, 0.15)";
                        }

                        msgEl.innerHTML = `Please park at<br><strong>${floorName} — SLOT ${data.slot}</strong>`;
                    }

                    setTimeout(() => {
                        document.getElementById('detected-view').style.display = 'none';
                        document.getElementById('idle-view').style.display = 'block';
                    }, 6000);
                }
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(checkEntry, 1000);
    </script>
</body>
</html>
