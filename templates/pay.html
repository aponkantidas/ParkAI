<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEase - Mobile Payment</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            font-size: 16px;
            box-sizing: border-box;
        }
        input { background: #0f172a; color: white; text-transform: uppercase; font-weight: bold; }
        select { background: #0f172a; color: white; }
        button {
            background: #22c55e;
            color: #052e16;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        button.check-btn { background: #38bdf8; color: #082f49; }
        .info-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #38bdf8;
        }
        .msg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Mobile Parking Payment</h2>
        <p style="color: #94a3b8; font-size: 14px; text-align: center;">Rate: 20 Taka / Hour</p>

        <input type="text" id="plate-input" placeholder="Enter Plate (e.g. DHA1234)">
        <button class="check-btn" onclick="checkStatus()">Check Parking Status</button>

        <div class="info-box" id="status-box">
            <div><strong>Entry Time:</strong> <span id="entry-time"></span></div>
            <div><strong>Current Stay:</strong> <span id="stay-mins"></span> mins</div>
            <div><strong>Already Paid:</strong> <span id="already-paid"></span> Taka</div>
            <div style="margin-top: 8px; color: #facc15;"><strong>Current Due:</strong> <span id="current-due"></span> Taka</div>

            <hr style="border-color: #334155; margin: 15px 0;">
            
            <label style="font-size: 14px; color: #cbd5e1;">Select Hours to Pre-Pay (or Clear Due):</label>
            <select id="hours-select">
                <option value="0">Pay Exact Current Due Only</option>
                <option value="1">1 Hour (20 Taka)</option>
                <option value="2">2 Hours (40 Taka)</option>
                <option value="3">3 Hours (60 Taka)</option>
                <option value="5">5 Hours (100 Taka)</option>
            </select>

            <button onclick="makePayment()">Pay Now (Dummy Wallet)</button>
        </div>

        <div class="msg" id="message"></div>
    </div>

    <script>
        async function checkStatus() {
            const plate = document.getElementById('plate-input').value.trim().toUpperCase();
            const msg = document.getElementById('message');
            const box = document.getElementById('status-box');
            msg.innerText = "";

            if (!plate) {
                msg.style.color = "#f87171";
                msg.innerText = "Please enter a license plate.";
                return;
            }

            const res = await fetch(`/api/check_plate/${plate}`);
            const data = await res.json();

            if (data.error) {
                box.style.display = "none";
                msg.style.color = "#f87171";
                msg.innerText = data.error;
            } else {
                box.style.display = "block";
                document.getElementById('entry-time').innerText = data.entry_time;
                document.getElementById('stay-mins').innerText = data.duration_mins;
                document.getElementById('already-paid').innerText = data.paid_amount;
                document.getElementById('current-due').innerText = data.due_now;
            }
        }

        async function makePayment() {
            const plate = document.getElementById('plate-input').value.trim().toUpperCase();
            const hours = parseFloat(document.getElementById('hours-select').value);
            const msg = document.getElementById('message');

            const res = await fetch('/api/pay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plate: plate, hours: hours })
            });
            const data = await res.json();

            if (data.success) {
                msg.style.color = "#4ade80";
                msg.innerText = `Payment of ${data.paid} Taka Successful! Valid until ${data.valid_until}.`;
                checkStatus();
            } else {
                msg.style.color = "#f87171";
                msg.innerText = data.error;
            }
        }
    </script>
</body>
</html>
